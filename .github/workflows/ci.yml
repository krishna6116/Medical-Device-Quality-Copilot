name: CI
on: [push, pull_request]

jobs:
  # Unit tests + Phase 1 checks. No network, no API keys, no full data download:
  # the EDA and the independent verifier run on a small committed fixture of real openFDA records,
  # and the generated findings doc must match the committed results files.
  test:
    runs-on: ubuntu-24.04  # pinned so a runner upgrade cannot change results silently
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Phase 1 EDA vs independent verifier on the fixture
        run: |
          python -m mdqc.eda --raw tests/fixtures/phase1/raw --out "$RUNNER_TEMP/phase1" --no-figures
          python -m mdqc.verify_phase1 --raw tests/fixtures/phase1/raw --summary "$RUNNER_TEMP/phase1/eda_summary.json" --no-download-checks
      - name: Findings doc is generated from the committed results
        run: python -m mdqc.report_phase1 --check

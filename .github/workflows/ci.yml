name: CI
on: [push, pull_request]

jobs:
  # Unit tests + Phase 1 checks. No network, no API keys, no full data download:
  # the EDA and the independent verifier run on a small committed fixture of real openFDA records,
  # and the generated findings doc must match the committed results files.
  test:
    runs-on: ubuntu-24.04  # pinned so a runner upgrade cannot change results silently
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history: the Phase 3 verifier checks the commit order (criteria -> labels -> results)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest
      - name: Phase 1 EDA vs independent verifier on the fixture
        run: |
          python -m mdqc.eda --raw tests/fixtures/phase1/raw --out "$RUNNER_TEMP/phase1" --no-figures
          python -m mdqc.verify_phase1 --raw tests/fixtures/phase1/raw --summary "$RUNNER_TEMP/phase1/eda_summary.json" --no-download-checks
      - name: Findings doc is generated from the committed results
        run: python -m mdqc.report_phase1 --check
      - name: Phase 3 offline verifier (order, spot-check, selection, test metrics) and doc
        run: |
          python -m mdqc.verify_phase3 --offline
          python -m mdqc.report_phase3 --check
      - name: Phase 4 offline verifier (fake-model loop tests, checkers, cost ledger, replay) and doc
        run: |
          python -m mdqc.verify_phase4 --offline
          python -m mdqc.report_phase4 --check
      - name: Phase 5 offline verifier (memory replay model, refusals, export, replay) and doc
        run: |
          python -m mdqc.verify_phase5 --offline
          python -m mdqc.report_phase5 --check

  # Phase 2: a real PostgreSQL. Loads the committed fixture, runs the database test
  # (including the tampered-cell check) and the independent verifier (P1-P8) on it.
  pipeline:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mdqc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/mdqc
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: pytest tests/test_phase2.py
      - name: Load the fixture and verify it independently
        run: |
          python -m mdqc.load --raw tests/fixtures/phase1/raw --schema core --no-summary
          python -m mdqc.verify_phase2 --raw tests/fixtures/phase1/raw --fixture
      - name: Phase 5 memory tests on the real database (needs the fixture loaded above)
        run: python -m pytest tests/test_phase5.py -rs
      - name: Pipeline doc is generated from the committed results
        run: python -m mdqc.report_phase2 --check

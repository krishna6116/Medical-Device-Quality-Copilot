# Light theme pinned: charts draw dark labels, so the app must not follow a viewer's dark system theme.
# Colours (v1.1): deep teal accent, cool grey surfaces.
[theme]
base = "light"
primaryColor = "#0E6E8C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F6F9"
textColor = "#16212E"

# Visitors see the viewer toolbar only (no developer "Deploy" button, also when run locally)
[client]
toolbarMode = "viewer"
